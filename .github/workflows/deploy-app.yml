# Пересборка приложения после изменения дизайн-системы.
#
# Приложение не ссылается на этот репозиторий во время работы: код DS
# вкомпилирован в его бандл на этапе сборки. Значит, правка здесь доедет
# до пользователя только тогда, когда приложение пересоберут, — а Vercel
# следит за репозиторием приложения и о пуше сюда ничего не знает.
# Этот воркфлоу и есть недостающее звено: он дёргает Deploy Hook.
#
# Секрет VERCEL_DEPLOY_HOOK — URL из Vercel: Settings → Git → Deploy Hooks.
# Хук ничего не читает и не пишет, он только запускает сборку, поэтому
# лежит в секретах репозитория, а не в коде.

name: Пересобрать приложение

on:
  push:
    branches: [master]
    # Правка витрины или документации на бандл приложения не влияет:
    # наружу уходит только то, что попадает в dist через build:lib.
    paths:
      - 'src/components/**'
      - 'src/primitives/**'
      - 'src/tokens/**'
      - 'package.json'
      - 'vite.lib.config.ts'
  # Ручной запуск: пригодится, если сборка упала по причине,
  # не связанной с кодом.
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Запустить сборку в Vercel
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Секрет VERCEL_DEPLOY_HOOK не задан — сборку запускать нечем." >&2
            exit 1
          fi
          # --fail: без него curl молча считает успехом любой ответ сервера,
          # включая 404 на отозванный хук, и воркфлоу зеленел бы впустую.
          curl --fail --silent --show-error --request POST "$HOOK" --output response.json
          echo "Сборка запрошена. Ответ Vercel:"
          cat response.json
